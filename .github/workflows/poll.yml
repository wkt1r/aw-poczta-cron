# Asks Poczta AW every 2 minutes to check for new mail, so the phone gets push notifications.
# GitHub's own schedule proved unreliable here (no runs for hours), so one job loops for ~5h50m and then
# starts the next run itself (workflow_dispatch from GITHUB_TOKEN is allowed to trigger runs).
# The schedule below only restarts the chain if it ever breaks. The key lives in the POLL_KEY secret.
name: Poczta AW poll
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
concurrency:
  group: poll
  cancel-in-progress: false
permissions:
  actions: write
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check for new mail every 2 minutes
        env:
          KEY: ${{ secrets.POLL_KEY }}
        run: |
          end=$((SECONDS + 350 * 60))
          while [ "$SECONDS" -lt "$end" ]; do
            curl -sS -m 60 -H "X-Poll-Key: $KEY" https://aw-poczta.vercel.app/api/poll || true
            echo
            sleep 120
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run poll.yml -R "$GITHUB_REPOSITORY"
